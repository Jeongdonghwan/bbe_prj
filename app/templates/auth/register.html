{% extends "layout/base.html" %}
{% block title %}회원가입{% endblock %}
{% block content %}
<div style="max-width:420px;margin:36px auto 0">
  <div class="card" style="padding:30px 32px 26px">
    <div style="display:flex;align-items:center;justify-content:center;gap:9px;padding-bottom:10px"><span style="font-family:var(--font);font-size:19px;font-weight:800;color:var(--text);letter-spacing:.04em;line-height:1">{{ APP_NAME }}</span><img src="{{ url_for('static', filename='img/logo-sym-violet.png') }}" alt="{{ APP_NAME }}" style="height:26px;width:auto"></div>
    <h1 style="font-size:20px;font-weight:700;text-align:center;margin-bottom:4px">회원가입</h1>
    <p class="thin" style="text-align:center;margin-bottom:18px">이메일 하나로 1분이면 끝납니다. 가입 즉시 바로 로그인됩니다.</p>
    <form method="post" action="/auth/register{% if next_url %}?next={{ next_url | urlencode }}{% endif %}" id="regForm" enctype="multipart/form-data">
      <div class="f"><label>이메일</label><input class="in" type="email" name="email" value="{{ form.get('email', '') }}" placeholder="you@example.com" required></div>
      <div class="row2">
        <div class="f"><label>비밀번호 <small>8자 이상</small></label><input class="in" type="password" name="password" minlength="8" required></div>
        <div class="f"><label>비밀번호 확인</label><input class="in" type="password" name="password2" minlength="8" required></div>
      </div>
      <div class="row2">
        <div class="f"><label>닉네임</label><input class="in" name="nickname" value="{{ form.get('nickname', '') }}" maxlength="20" required></div>
        <div class="f"><label>연락처 <small>알림톡 수신용</small></label><input class="in" name="phone" value="{{ form.get('phone', '') }}" placeholder="010-1234-5678" required></div>
      </div>
      <div class="f"><label>상호</label><input class="in" name="biz_name" value="{{ form.get('biz_name', '') }}" maxlength="60" placeholder="사업자등록증상 상호" required></div>
      <div class="f"><label>사업자등록번호 <small>확인하기를 눌러 국세청 조회를 마쳐야 가입됩니다</small></label>
        <div style="display:flex;gap:6px"><input class="in" name="biz_no" value="{{ form.get('biz_no', '') }}" inputmode="numeric" maxlength="12" placeholder="숫자 10자리" required style="flex:1">
          <button class="btn sec" type="button" id="bizBtn" style="height:40px;flex:none">확인하기</button></div>
        <div class="hint" id="bizHint"></div></div>
      <div class="f"><label>사업자등록증 <small>선택 · JPG/PNG/PDF 10MB 이하 — 나중에 마이페이지에서 올려도 됩니다</small></label><input class="in" type="file" name="biz_cert" accept="image/jpeg,image/png,image/webp,application/pdf" style="padding:7px 10px;height:auto"></div>
      <div class="f" style="margin:10px 0 8px">
        <label class="chk" style="cursor:pointer" id="agreeAll"><input type="checkbox" hidden><i></i><b>전체 동의</b></label>
        <div style="border-top:1px solid var(--border);margin:6px 0"></div>
        <label class="chk" style="cursor:pointer"><input type="checkbox" name="agree_terms" value="1" hidden><i></i>(필수) <a class="lnk" href="/terms" target="_blank">이용약관</a> 동의</label>
        <label class="chk" style="cursor:pointer"><input type="checkbox" name="agree_privacy" value="1" hidden><i></i>(필수) <a class="lnk" href="/privacy" target="_blank">개인정보 수집·이용</a> 동의</label>
        <label class="chk" style="cursor:pointer"><input type="checkbox" name="agree_marketing" value="1" hidden><i></i>(선택) 이벤트 · 신규 매체 소식 받기</label>
      </div>
      <button class="btn pri lg" type="submit">동의하고 가입하기</button>
    </form>
    <p class="thin" style="text-align:center;margin-top:12px;font-size:12.5px">이미 계정이 있으신가요? <a class="lnk" href="/auth/login{% if next_url %}?next={{ next_url | urlencode }}{% endif %}">로그인</a></p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function () {
  var f = document.getElementById('regForm');
  f.querySelectorAll('.chk').forEach(function (c) { c.addEventListener('click', function (e) { if (e.target.closest('a')) return; setTimeout(function () { c.classList.toggle('on', c.querySelector('input').checked); }, 0); }); });
  document.getElementById('agreeAll').addEventListener('click', function () { setTimeout(function () {
    var on = document.querySelector('#agreeAll input').checked;
    f.querySelectorAll('.chk input[name]').forEach(function (i) { i.checked = on; i.closest('.chk').classList.toggle('on', on); });
  }, 0); });
  // 사업자번호 — "확인하기"로 국세청 조회를 끝내야 가입 버튼이 통과한다 (서버도 다시 확인한다)
  var bn = f.querySelector('input[name=biz_no]'), btn = document.getElementById('bizBtn'),
      hint = document.getElementById('bizHint'), verified = null;   // 확인을 통과한 번호
  function show(text, color, busy) {
    hint.innerHTML = '';
    var s = document.createElement('span');
    s.textContent = text;
    if (busy) s.className = 'rk-wait';
    hint.appendChild(s);
    hint.style.color = color || '';
  }
  function check() {
    var v = bn.value.trim();
    if (!v) { show('사업자등록번호를 입력해주세요.', 'var(--danger)'); bn.focus(); return; }
    btn.disabled = true; show('국세청에서 확인 중입니다…', '', true);
    fetch('/auth/biz-check?b_no=' + encodeURIComponent(v)).then(function (r) { return r.json(); }).then(function (j) {
      if (j.ok) {
        verified = v;
        show(j.label ? '확인 완료 · ' + j.label : '확인 완료 (국세청 조회를 건너뛰었습니다)', 'var(--success)');
      } else { verified = null; show(j.label || '확인할 수 없는 번호입니다.', 'var(--danger)'); }
    }).catch(function () { verified = null; show('조회 중 오류가 났습니다. 잠시 후 다시 눌러주세요.', 'var(--danger)'); })
      .finally(function () { btn.disabled = false; });
  }
  btn.addEventListener('click', check);
  bn.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); check(); } });
  bn.addEventListener('input', function () { if (verified !== null && bn.value.trim() !== verified) { verified = null; show('번호가 바뀌었습니다. 다시 확인해주세요.', 'var(--warn)'); } });
  if (bn.value.trim()) check();   // 서버가 다른 이유로 되돌려 보낸 경우 다시 누르지 않아도 되게
  f.addEventListener('submit', function (e) {
    var t = f.querySelector('input[name=agree_terms]').checked, p = f.querySelector('input[name=agree_privacy]').checked;
    if (verified === null || bn.value.trim() !== verified) {
      e.preventDefault(); show('사업자등록번호 확인하기를 눌러 조회를 마쳐주세요.', 'var(--danger)'); bn.focus(); return;
    }
    if (!t || !p) { e.preventDefault(); alert('이용약관과 개인정보 수집·이용에 동의해주세요.'); }
  });
})();
</script>
{% endblock %}
