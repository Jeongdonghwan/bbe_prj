{% extends "layout/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="ph"><div><h1>{{ title }}</h1><p>최종 수정 2026-08-31 · 정식 오픈 전 초안입니다.</p></div></div>
<div class="card"><div class="cb" style="padding-top:18px;font-size:14px;line-height:1.8;max-width:820px">
  {% for h, body in sections %}
  <h2 style="font-size:15px;font-weight:700;margin:{% if not loop.first %}18px{% else %}0{% endif %} 0 6px">{{ loop.index }}. {{ h }}</h2>
  <p style="color:var(--text-2)">{{ body }}</p>
  {% endfor %}
</div></div>
{% endblock %}
