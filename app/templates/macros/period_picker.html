{# Start date + duration cards. Each card shows the live date range (filled by wizard.js). #}
{% macro period_picker(options, start_date, min_date, selected) %}
<div class="wz-field" style="max-width:260px">
  <label for="f-start">시작일</label>
  <p class="wz-hint">접수는 24시간 가능하고, 구동은 다음 날부터 시작됩니다.</p>
  <input class="in" type="date" id="f-start" name="start_date" value="{{ start_date.isoformat() }}" min="{{ min_date.isoformat() }}" required>
  <span class="wz-err" id="e-start" hidden></span>
</div>
<div class="wz-field">
  <label>광고 기간</label>
  <p class="wz-hint" id="dateRange">-</p>
  <div class="dcards">
    {% for d in options %}
    <button type="button" class="dcard{% if d == selected %} on{% endif %}" data-d="{{ d }}">
      {% if loop.first %}<span class="dpop">많이 선택</span>{% endif %}
      <b>{{ d }}일</b><span class="dcard-range num" data-range="{{ d }}"></span>
    </button>
    {% endfor %}
  </div>
</div>
{% endmacro %}
