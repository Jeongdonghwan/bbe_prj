    # ── bbe 순위 서버 콜백 (2026-09-28) ──────────────────────────────────
    # 앱은 :8034 로 뜨는데 카페24 네트워크 단에서 8034 인바운드가 막혀 있다.
    # 순위 서버(211.45.175.226)의 콜백이 전부 ConnectTimeout 으로 죽어서,
    # 열려 있는 80 으로 받아 내부 8034 로 넘긴다.
    #
    # 이 서버의 80 번은 다른 앱(127.0.0.1:8080)이 쓰고 있고 그 앱이 /api/* 를
    # 이미 가로채므로, 겹치지 않는 경로를 쓴다. 정확 일치(=)라 location / 보다 우선한다.
    #
    # 이 블록을 80 번 server 블록 안에 넣는다 (설치 절차는 docs/RANK_INTEGRATION.md).
    location = /bbe/rank-callback {
        proxy_pass http://127.0.0.1:8034/api/rank/callback;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
        client_max_body_size  64k;
    }
