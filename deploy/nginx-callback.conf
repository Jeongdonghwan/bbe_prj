# 순위 서버 콜백 수신용 nginx (2026-09-28)
#
# 왜 필요한가: 앱은 :8034 로 뜨는데 카페24 네트워크 단에서 8034 인바운드가 막혀 있다.
# 순위 서버(211.45.175.226)에서 우리 쪽으로 오는 콜백이 전부 ConnectTimeout 으로 죽었다.
# 80/443 은 열려 있으므로 80 으로 받아 내부 8034 로 넘긴다.
#
#   sudo cp deploy/nginx-callback.conf /etc/nginx/sites-available/bbe.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo ln -sf /etc/nginx/sites-available/bbe.conf /etc/nginx/sites-enabled/bbe.conf
#   sudo nginx -t && sudo systemctl enable --now nginx && sudo systemctl reload nginx
#
# 그다음 순위 서버 .env 의 NSR_PARTNER_CALLBACK_URL 에서 우리 주소의 ":8034" 를 뺀다.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 콜백만 앱으로 넘긴다. 사이트 본문은 지금처럼 :8034 로 서비스한다.
    location = /api/rank/callback {
        proxy_pass http://127.0.0.1:8034;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
        client_max_body_size  64k;
    }

    # 그 외 80 번 요청은 받지 않는다 (사이트를 80 으로 옮길 때 이 블록을 바꾼다).
    location / { return 404; }
}
