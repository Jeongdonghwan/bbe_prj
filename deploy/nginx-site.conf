# ── 마이마케팅 도메인 server 블록 (2026-09-30) ─────────────────────────────
# 셀프마이마케팅.kr = xn--hz2ba848cszgbqko5fcyd.kr (한글 도메인은 nginx 에 punycode 로 적는다)
#
# 이 서버의 80 번은 다른 앱(ilioom)이 default_server 로 쥐고 있다. 그 블록은 그대로 두고,
# 우리 도메인으로 들어온 요청만 이 블록이 받아 :8034(waitress) 로 넘긴다. server_name 이
# 정확히 맞는 블록이 default_server 보다 우선하므로 겹치지 않는다.
#
# 443 은 certbot --nginx 가 이 파일에 직접 붙여 넣는다 (listen 443 ssl + 80→443 리다이렉트).
# 그래서 여기엔 80 만 적어 둔다. 설치는 deploy/install_site_nginx.py, 절차는 docs/DOMAIN_SETUP.md.
server {
    listen 80;
    listen [::]:80;
    server_name xn--hz2ba848cszgbqko5fcyd.kr www.xn--hz2ba848cszgbqko5fcyd.kr;

    # 배너·매체 로고 업로드 (어드민). 기본 1m 이면 업로드가 413 으로 죽는다.
    client_max_body_size 10m;

    # certbot 이 도메인 소유 확인에 쓰는 경로 — 앱으로 넘기지 않는다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:8034;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        # 캠페인 만들기 마지막 단계·엑셀 추출은 몇 초 걸릴 수 있다.
        proxy_read_timeout    60s;
        proxy_redirect        off;
    }

    # 정적 파일은 앱(waitress)이 그대로 내주되 브라우저 캐시만 길게. 파일이 /root 아래라
    # nginx(www-data) 가 직접 읽을 수 없어 alias 로 빼지 않는다.
    location /static/ {
        proxy_pass http://127.0.0.1:8034;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/mymarketing.access.log;
    error_log  /var/log/nginx/mymarketing.error.log;
}
